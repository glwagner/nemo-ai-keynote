# Candidate 8°×8° (or smaller) boxes for SST-gradient wavenumber spectra.
# satellite: which geostationary L3C product views the box most directly.
#   goes   = ABI_G19-STAR-L3C-v3.0        (GOES-19 at 75.2°W, 0.02°)
#   seviri = SEVIRI_SST-OSISAF-L3C-v1.0   (Meteosat-10 at 0°, 0.05°)
# Longitudes in degrees east (-180..180).

[gulf_stream]
name = "Gulf Stream"
lat = [34.0, 42.0]
lon = [-72.0, -64.0]
satellite = "goes"

