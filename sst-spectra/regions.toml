# Cross-satellite check: the same box and hour seen by both GOES-19 and SEVIRI (~50° zenith each)
[mid_atlantic_goes]
name = "Mid-Atlantic subtropical gyre (GOES-19, 03 UTC)"
lat = [25.0, 33.0]
lon = [-42.0, -34.0]
satellite = "goes"
hour = 3

[mid_atlantic_seviri]
name = "Mid-Atlantic (SEVIRI)"
lat = [25.0, 33.0]
lon = [-42.0, -34.0]
satellite = "seviri"
hour = 3
